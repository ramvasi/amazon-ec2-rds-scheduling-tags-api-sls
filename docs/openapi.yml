openapi: 3.0.0
info:
  title: Microservices
  description:
    APIs for Schedule Tags
  version: 1.0.0
servers:
  - url: https://vpce-0127fc69-kykwwlo6.execute-api.us-east-1.vpce.amazonaws.com/dev/v1
    description: Development environment
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/test-org.onmicrosoft.com/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/its.test-org.com/oauth2/v2.0/token
          scopes:
            read: Grants read access
            write: Grants write access
security:
  - OAuth2: [read, write]
paths:
  /v1/accounts/{account_id}/regions/{region}/{resource_type}/{resource_id}/schedule:
    delete:
      tags:
        - Delete Schedule Tags API
      summary: API that removes schedule tags for RDS and EC2 instances.
      description: >
        <b>Delete Schedule Tags API</b> removes schedule tags for RDS and EC2 instances. <br /><br />
      consumes:
        - none
      produces:
        - application/json
      parameters:
        - in: header
          name: Host
          required: true
          schema:
            type: string
          description: Host for Lambda endpoint
        - in: header
          name: request-context-id
          schema:
            type: string
          description: Unique id for the request. If provided, that id is added to all logging messages
        - in: path
          name: account_id
          schema:
            type: string
          required: true
          description: VPCx Account name where instance resides
        - in: path
          name: region
          schema:
            type: string
          required: true
          description: AWS region of the instance
        - in: path
            name: resource_type
            schema:
              type: string
            required: true
            description: Instance type. Can be rds or ec2
        - in: path
            name: resource_id
            schema:
              type: string
            required: true
            description: Resource id (instance id for ec2 resources, instance-db_identifier or cluster_cluster_id for rds)

      responses:
        '200':
          description: >-
            OK
          content:
            application/json:
              schema:
                type: object
                example:
                  - message: "Successfully removed tags"

        '400':
          description: >-
            Invalid account
          content:
            application/json:
              schema:
                type: object
                example:
                  - error: "Invalid account"

        '401':
          description: >-
            UNAUTHORIZED - User or App token not authorized
          content:
            application/json:
              schema:
                type: object
                example:
                  - error: "UNAUTHORIZED (User/App Token Unauthorized)"

        '404':
          description: >-
            NOT FOUND - Instance does not exist
          content:
            application/json:
              schema:
                type: object
                example:
                  - error: "Resource not found"

    get:
      tags:
        - Get Schedule Tags API
      summary: API that lists schedule tags for RDS and EC2 instances.
      description: >
        <b>Get Schedule Tags API</b> lists schedule tags for RDS and EC2 instances. <br /><br />
      consumes:
        - none
      produces:
        - application/json
      parameters:
        - in: header
          name: Host
          required: true
          schema:
            type: string
          description: Host for Lambda endpoint
        - in: header
          name: request-context-id
          schema:
            type: string
          description: Unique id for the request. If provided, that id is added to all logging messages
        - in: path
          name: account_id
          schema:
            type: string
          required: true
          description: VPCx Account name where instance resides
        - in: path
          name: region
          schema:
            type: string
          required: true
          description: AWS region of the instance
        - in: path
           name: resource_type
           schema:
             type: string
           required: true
           description: Instance type. Can be rds or ec2
        - in: path
            name: resource_id
            schema:
              type: string
            required: true
            description: Resource id (instance id for ec2 resources, instance-db_identifier or cluster_cluster_id for rds)

        requestBody:
          description: A JSON object containing Schedule tags
          required: true
          content:
            application/json:
              schema: # Request body contents
                type: object
                properties:
                  timezone:
                    type: string
                  type:
                    type: string
                  time:
                    type: integer
                example: # Sample object
                  timezone: pt
                  type: on-hours
                  time: 20

      responses:
        '200':
          description: >-
            OK
          content:
            application/json:
              schema:
                type: object
                example:
                  - message: >
                       [{
                          "Key": "on-hours",
                          "Value": "M-F/5:tz=utc:"
                         },
                         {
                          "Key": "off-hours",
                          "Value": "M-F/20:tz=utc:"
                         }
                      ]

        '400':
          description: >-
            Invalid account
          content:
            application/json:
              schema:
                type: object
                example:
                  - error: "Invalid account"

        '401':
          description: >-
            UNAUTHORIZED - User or App token not authorized
          content:
            application/json:
              schema:
                type: object
                example:
                  - error: "UNAUTHORIZED (User/App Token Unauthorized)"

        '404':
          description: >-
            NOT FOUND - Instance does not exist
          content:
            application/json:
              schema:
                type: object
                example:
                  - error: "Resource not found"
    put:
      tags:
        - Put Schedule Tags API
      summary: API that adds schedule tags for RDS and EC2 instances.
      description: >
        <b>Put Schedule Tags API</b> adds schedule tags for RDS and EC2 instances. <br /><br />
      consumes:
        - none
      produces:
        - application/json
      parameters:
        - in: header
          name: Host
          required: true
          schema:
            type: string
          description: Host for Lambda endpoint
        - in: header
          name: request-context-id
          schema:
            type: string
          description: Unique id for the request. If provided, that id is added to all logging messages
        - in: path
          name: account_id
          schema:
            type: string
          required: true
          description: VPCx Account name where instance resides
        - in: path
          name: region
          schema:
            type: string
          required: true
          description: AWS region of the instance
        - in: path
            name: resource_type
            schema:
              type: string
            required: true
            description: Instance type. Can be rds or ec2
        - in: path
            name: resource_id
            schema:
              type: string
            required: true
            description: Resource id (instance id for ec2 resources, instance-db_identifier or cluster_cluster_id for rds)

      responses:
        '200':
          description: >-
            OK
          content:
            application/json:
              schema:
                type: object
                example:
                  - message: "Successfully added tags"

        '400':
          description: >-
            Invalid account
          content:
            application/json:
              schema:
                type: object
                example:
                  - error: "Invalid account"

        '401':
          description: >-
            UNAUTHORIZED - User or App token not authorized
          content:
            application/json:
              schema:
                type: object
                example:
                  - error: "UNAUTHORIZED (User/App Token Unauthorized)"

        '404':
          description: >-
            NOT FOUND - Instance does not exist
          content:
            application/json:
              schema:
                type: object
                example:
                  - error: "Resource not found"
